name: Release

# Publish a GitHub Release for a version tag. Tags are cut on the internal forge, which
# push-mirrors them here. A mirrored tag does not always fire the tag push event, so the
# workflow can also be run by hand against the tag:
#   gh workflow run Release --ref v0.1.0-beta.1
# See docs/RELEASING.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, check & sign
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # keyless cosign signing of SHA256SUMS via GitHub OIDC
    env:
      TAG: ${{ github.ref_name }}
    steps:
      # Full history, so the tagged commit can be compared with origin/main.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Releases are cut on main. This applies to workflow_dispatch runs too: they run
      # against a tag ref, so the same check covers them.
      - name: The tag is on main
        run: |
          if ! git rev-parse --verify --quiet refs/remotes/origin/main >/dev/null; then
            echo "origin/main does not exist here: cannot tell whether $TAG is on main. Refusing to release."
            echo "If the mirror has not delivered main yet, re-run this workflow once it has."
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "$TAG ($(git rev-parse --short HEAD)) is not on main. Releases are tagged on main only."
            echo "Nothing was published. Delete the tag, land the change on dev, wait for promotion, and tag main."
            echo "If main is behind because the mirror is late, re-run this workflow once main has arrived."
            exit 1
          fi
          echo "$TAG is on main."

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      # The web UI is built by `make web` and embedded in the binary; it needs Node 22 or
      # later. Pin it, so a release never depends on what the runner image happens to ship.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Release notes from CHANGELOG.md
        run: make --no-print-directory release-notes VERSION="$TAG" > release-notes.md

      - name: Build the archives and SHA256SUMS
        run: make dist VERSION="$TAG"

      # `make web` quietly skips the UI when npm is missing. A release must carry it.
      - name: The web UI is built into the binaries
        run: |
          test -f internal/webui/app/index.html || {
            echo "internal/webui/app/index.html is missing: the web UI was not built. Refusing to release."
            exit 1
          }

      - name: Six archives and their checksums
        run: |
          for t in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            test -f "dist/shepherd-$TAG-$t.tar.gz" || { echo "missing $t archive"; exit 1; }
          done
          for t in windows-amd64 windows-arm64; do
            test -f "dist/shepherd-$TAG-$t.zip" || { echo "missing $t archive"; exit 1; }
          done
          test "$(wc -l < dist/SHA256SUMS)" -eq 6 || { echo "SHA256SUMS should list six archives"; cat dist/SHA256SUMS; exit 1; }
          ls -l dist

      - name: The binary reports the tag
        run: |
          got="$(SHEPHERD_NO_AUTOSTART=1 SHEPHERD_HOME="$RUNNER_TEMP/shepherd" dist/shepherd-linux-amd64 version)"
          if [ "$got" != "shepherd $TAG" ]; then
            echo "tag $TAG, but the binary reports: $got"
            exit 1
          fi
          echo "$got"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # The bundle carries the signature and the short-lived certificate that binds it to
      # this workflow at this tag; verify with cosign verify-blob (docs/RELEASING.md).
      - name: Sign SHA256SUMS (keyless)
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            release-notes.md
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
            dist/SHA256SUMS.sigstore.json
          if-no-files-found: error

  # The container image, built from the same tag and signed keyless. The build job has
  # already refused a tag that is not on main. Registries: GHCR always; a second one
  # (for example Docker Hub) when the repository variable IMAGE_MIRROR_REPOSITORY is set
  # to its path (docker.io/example/shepherd) with secrets IMAGE_MIRROR_USERNAME and
  # IMAGE_MIRROR_PASSWORD.
  image:
    name: Build, check & sign the image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # keyless cosign signing via GitHub OIDC
    env:
      TAG: ${{ github.ref_name }}
      MIRROR: ${{ vars.IMAGE_MIRROR_REPOSITORY }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Image names
        id: names
        run: |
          repo="$(echo "ghcr.io/$GITHUB_REPOSITORY" | tr 'A-Z' 'a-z')"
          echo "ghcr=$repo" >> "$GITHUB_OUTPUT"
          tags="$repo:$TAG"
          if [ -n "$MIRROR" ]; then tags="$tags,$MIRROR:$TAG"; fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/login-action@v3
        if: ${{ vars.IMAGE_MIRROR_REPOSITORY != '' }}
        with:
          registry: ${{ split(vars.IMAGE_MIRROR_REPOSITORY, '/')[0] }}
          username: ${{ secrets.IMAGE_MIRROR_USERNAME }}
          password: ${{ secrets.IMAGE_MIRROR_PASSWORD }}

      # Build for the runner first and check it before anything is pushed: non-root, tini as
      # PID 1, the tools the design names, and the binary reports the tag.
      - name: Build for checking
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: shepherd-check:local
          build-args: VERSION=${{ github.ref_name }}

      - name: Check the image
        run: |
          set -eu
          [ "$(docker run --rm --entrypoint id shepherd-check:local -u)" = 10001 ]
          [ "$(docker image inspect -f '{{.Config.User}}' shepherd-check:local)" = 10001:10001 ]
          docker image inspect -f '{{json .Config.Entrypoint}}' shepherd-check:local | grep -q '/usr/bin/tini'
          docker run --rm --entrypoint sh shepherd-check:local -c 'git --version && glab --version && gh --version && ssh -V && sqlite3 --version'
          got="$(docker run --rm --entrypoint shepherd shepherd-check:local version)"
          [ "$got" = "shepherd $TAG" ] || { echo "tag $TAG, but the image reports: $got"; exit 1; }
          # An empty volume starts and answers the health check. The key file is the one
          # credential the daemon needs to start with a hosted config.
          k="$(mktemp -d)"
          head -c 32 /dev/urandom > "$k/totp-key"
          chmod 0600 "$k/totp-key"
          sudo chown 10001:10001 "$k/totp-key"
          docker run -d --name shepherd-check \
            -e SHEPHERD_PUBLIC_URL=https://shepherd.example.com -e SHEPHERD_TRUSTED_PROXIES=172.17.0.0/16 \
            -v "$(docker volume create)":/data/home -v "$(docker volume create)":/data/workspace \
            -v "$k/totp-key":/run/secrets/shepherd/totp-key:ro shepherd-check:local
          for i in $(seq 1 30); do
            docker exec shepherd-check shepherd status >/dev/null 2>&1 && { echo "health check answers"; exit 0; }
            sleep 2
          done
          docker logs shepherd-check
          exit 1

      - name: Push the multi-architecture image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.names.outputs.tags }}
          build-args: VERSION=${{ github.ref_name }}
          provenance: mode=max

      - uses: sigstore/cosign-installer@v3

      # Signed by digest, for each registry the image went to.
      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          GHCR: ${{ steps.names.outputs.ghcr }}
        run: |
          cosign sign --yes "$GHCR@$DIGEST"
          if [ -n "$MIRROR" ]; then cosign sign --yes "$MIRROR@$DIGEST"; fi

  publish:
    name: Publish the GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its assets
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release

      - name: Create the release
        run: |
          pre=
          case "$TAG" in *-*) pre=--prerelease ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag $pre \
            --title "$TAG" --notes-file release-notes.md \
            dist/*.tar.gz dist/*.zip dist/SHA256SUMS dist/SHA256SUMS.sigstore.json
