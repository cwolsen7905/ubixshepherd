# Kelpie's review (kelpie-review), run from Kelpie's image, advisory. It replaced the
# old ai-review-mr template job: it posts threads on a merge request into dev (this repo's
# default branch, the job's default target, so AI_REVIEW_BASE_BRANCH stays unset). The ref
# is the commit of Kelpie's dev that holds ci/kelpie.yml; bump it on purpose. Needs
# OPENROUTER_API_KEY and AI_REVIEW_GITLAB_TOKEN, plus KELPIE_REGISTRY_USER and
# KELPIE_REGISTRY_TOKEN (read_registry) as group variables to pull the image from another
# project. Without them it exits 75, "unreviewed", and is allowed to fail: never red.
# Docs: docs/ai-review.md in that project.
#
# Included on merge request pipelines only, where the job can run: at the pinned ref the
# file defines one job, kelpie-review, and every rule of it requires merge_request_event.
# Check that again when the ref is bumped. The include is fetched at pipeline creation, and
# a pipeline whose user cannot read the private ubixkelpie project fails there, with no
# jobs. So a push pipeline must not include it unless that user can read the project. A
# merge request pipeline needs its author to read it too; if an author cannot, a
# maintainer re-runs the pipeline.
include:
  - project: ubixsys/ubixkelpie
    ref: 788c9416214a6bdf4ceaffd851eaf34ac7850a38 # dev
    file: ci/kelpie.yml
    rules:
      - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# The default stages plus approval and promote. The checks stay in the default test stage.
# approval only runs in merge request pipelines and promote only in dev push pipelines, so
# the two never meet; both come after the checks so a red sign-off never hides them.
stages: [build, test, deploy, approval, promote]

# One pipeline per push. A merge request gets a merge request pipeline, the one that
# "Pipelines must succeed" judges, so the approval job has to be in it; the push to its
# branch then starts no branch pipeline of its own. dev and main always get their push
# pipelines (promote-to-main runs there), and so does a branch with no open MR, a tag, or
# anything else that ran before.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_COMMIT_BRANCH != "dev" && $CI_COMMIT_BRANCH != "main"'
      when: never
    - when: always

# The checks run in every pipeline the workflow lets through, merge request pipelines
# included (a job without rules would skip those).
.every_pipeline:
  rules:
    - when: on_success

# The repo is public and mirrored, so nothing private may be committed. The pattern of
# private names lives in the PUBLIC_BOUNDARY_PATTERN CI variable (project settings, not the
# repo, so the list itself is not published). The job prints file and line only, never the
# matched text, so the job log does not publish it either.
public-boundary:
  extends: .every_pipeline
  tags: [shell]            # the instance runner is a shell executor that takes tagged jobs only
  script:
    - |
      if [ -z "${PUBLIC_BOUNDARY_PATTERN:-}" ]; then
        echo "PUBLIC_BOUNDARY_PATTERN is not set in CI/CD variables; refusing to pass unchecked."
        exit 1
      fi
      hits=$(grep -rniE --exclude-dir=.git -- "$PUBLIC_BOUNDARY_PATTERN" . | cut -d: -f1,2 || true)
      if [ -n "$hits" ]; then
        echo "Private names found (file:line):"
        echo "$hits"
        exit 1
      fi
      echo "Public boundary clean."

# Go jobs run in the official Go image (the shell runner has no Go of its own), as the
# runner's uid so nothing root-owned lands in the checkout. The build and module caches
# live under the runner's home, so later pipelines reuse them.
.go:
  extends: .every_pipeline
  tags: [shell]
  variables:
    GO_IMAGE: golang:1.26
  before_script:
    - mkdir -p "$HOME/.cache/ubixshepherd-go"
    - |
      go_run() {
        docker run --rm -v "$PWD:/src" -w /src --user "$(id -u):$(id -g)" \
          -v "$HOME/.cache/ubixshepherd-go:/cache" \
          -e HOME=/tmp -e GOCACHE=/cache/build -e GOMODCACHE=/cache/mod -e GOFLAGS=-buildvcs=false \
          -e VERSION="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}" \
          "$GO_IMAGE" sh -c "$1"
      }

go-check:
  extends: .go
  script:
    - go_run 'go version && git --version && make check'  # the Fold tests need git; never let them skip

go-cross:
  extends: .go
  script:
    - go_run 'make cross VERSION=$VERSION'
  artifacts:
    paths: [dist/]
    expire_in: 1 week

# Web type check. Runs in the same stage as the Go checks; a TypeScript error
# fails the pipeline. Uses the same Docker pattern as the Go jobs since the
# shell runner has no Node of its own.
.web:
  extends: .every_pipeline
  tags: [shell]
  variables:
    WEB_IMAGE: node:22-alpine
  before_script:
    - mkdir -p "$HOME/.cache/ubixshepherd-npm"
    - |
      web_run() {
        docker run --rm -v "$PWD:/src" -w /src --user "$(id -u):$(id -g)" \
          -v "$HOME/.cache/ubixshepherd-npm:/cache" \
          -e NPM_CONFIG_CACHE=/cache -e CI=true \
          "$WEB_IMAGE" sh -c "$1"
      }

web-typecheck:
  extends: .web
  script:
    - web_run 'cd web && npm ci && npm run typecheck'

# dev -> main. main only ever moves by fast-forward from a green dev (bin/promote.sh, which
# fails closed and never forces). Runs only on a push pipeline of the dev branch, and only
# once all three checks above have passed. The promotion's own push to main starts a pipeline
# on main, where this rule does not match, so it cannot promote again. Needs the
# GITLAB_PROMOTE_TOKEN CI variable (masked and protected).
promote-to-main:
  stage: promote
  tags: [shell]
  needs: [public-boundary, go-check, go-cross, web-typecheck]
  resource_group: promote-main   # two quick pushes to dev cannot promote at once
  interruptible: false
  variables:
    GIT_DEPTH: "0"               # the fast-forward test needs full history
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" && $CI_PIPELINE_SOURCE == "push"'
  script:
    - bash bin/promote.sh

# Every merge needs a human sign-off: an Approve or a thumbs-up on the MR
# (bin/ci/require-approval.sh). Agents may arm merge-when-pipeline-succeeds on their own
# lane, and dev is promoted to main and mirrored in public, so with "Pipelines must
# succeed" on, this job failing is what keeps a merge waiting for a person. Agents never
# approve and never give the thumbs-up. GitLab does not re-run a pipeline on approval:
# approve, then retry this job.
# Every MR here is opened under the maintainer's account, so a username listed in
# MERGE_APPROVAL_OWNERS may sign off on their own MR, and the job log records it. With the
# variable unset, only a sign-off from someone other than the author counts.
# APPROVAL_CHECK_TOKEN: project access token, Reporter role, read_api scope. Masked but
# NOT protected: MR branches are unprotected, so a protected variable would never reach
# this job, and without it the job fails.
require-approval:
  stage: approval
  tags: [shell]
  timeout: 5 minutes
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - bash bin/ci/require-approval.sh
