{{- if and .Values.ingress.enabled (ne .Values.mode "worker") }}
{{- $host := required "ingress.host is required when ingress.enabled" .Values.ingress.host }}
# TLS ends here. The daemon only takes plain HTTP from the proxy addresses in
# daemon.public.trusted_proxies, and only with X-Forwarded-Proto: https, which ingress-nginx
# sets.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "shepherd.fullname" . }}
  labels: {{- include "shepherd.labels" . | nindent 4 }}
  {{- /* One map, so a key is written once: extraAnnotations wins over annotations, both over the issuer. */}}
  {{- $annotations := dict }}
  {{- with .Values.ingress.clusterIssuer }}
  {{- $_ := set $annotations "cert-manager.io/cluster-issuer" . }}
  {{- end }}
  {{- $annotations = mergeOverwrite $annotations (.Values.ingress.annotations | default dict) (.Values.ingress.extraAnnotations | default dict) }}
  {{- with $annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  tls:
    - hosts: [{{ $host }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  rules:
    - host: {{ $host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: {{ include "shepherd.fullname" . }}, port: {name: https}}
{{- end }}
