{{- if .Values.ingress.enabled }}
{{- $host := required "ingress.host is required when ingress.enabled" .Values.ingress.host }}
# TLS ends here. The daemon only takes plain HTTP from the proxy addresses in
# daemon.public.trusted_proxies, and only with X-Forwarded-Proto: https, which ingress-nginx
# sets.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "shepherd.fullname" . }}
  labels: {{- include "shepherd.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.ingress.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ . }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.ingress.extraAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  tls:
    - hosts: [{{ $host }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  rules:
    - host: {{ $host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: {{ include "shepherd.fullname" . }}, port: {name: https}}
{{- end }}
