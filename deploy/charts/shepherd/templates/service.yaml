apiVersion: v1
kind: Service
metadata:
  name: {{ include "shepherd.fullname" . }}
  labels: {{- include "shepherd.labels" . | nindent 4 }}
spec:
  clusterIP: None            # headless: the StatefulSet's governing service
  selector: {{- include "shepherd.selectorLabels" . | nindent 4 }}
  ports:
    - {name: https, port: {{ .Values.service.port }}, targetPort: https}
