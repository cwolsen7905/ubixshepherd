{{- with .Values.credentials.externalSecret }}
{{- if .enabled }}
# Makes the credentials Secret from a store you run, with the External Secrets Operator.
# The Secret refreshes on refreshInterval, but the glab, gh and claude entries are only
# seeds: the pod copies each into the home once and never replaces it, so a rotated token
# there has no effect until its file under /data/home/cli is deleted and the pod
# restarted. totp-key and the ssh files are read from the Secret on every start.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $.Values.credentials.secretName }}
  labels: {{- include "shepherd.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ .refreshInterval }}
  secretStoreRef: {{- toYaml .storeRef | nindent 4 }}
  target:
    name: {{ $.Values.credentials.secretName }}
    creationPolicy: Owner
  data:
    {{- range .keys }}
    - secretKey: {{ . }}
      remoteRef: {key: {{ printf "%s%s" $.Values.credentials.externalSecret.remoteKeyPrefix . }}}
    {{- end }}
{{- end }}
{{- end }}
