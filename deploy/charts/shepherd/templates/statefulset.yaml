{{- $url := required "seed.publicUrl is required (https://shepherd.example.com)" .Values.seed.publicUrl -}}
{{- if not (hasPrefix "https://" $url) -}}
{{- fail "seed.publicUrl must start with https://" -}}
{{- end -}}
{{- $proxies := required "seed.trustedProxies is required: the ingress controller's pod addresses" .Values.seed.trustedProxies -}}
# One replica: the home lock refuses a second daemon, and the volume is ReadWriteOnce.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "shepherd.fullname" . }}
  labels: {{- include "shepherd.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "shepherd.fullname" . }}
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels: {{- include "shepherd.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "shepherd.selectorLabels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      # fsGroup makes the volume writable by the daemon and the Secret's files readable by
      # its group (mode 0440). That would trip the daemon's refusal of a group-readable
      # TOTP key, so the daemon never sees the Secret mount: the place-credentials step
      # below copies each file to a private volume at 0600.
      securityContext: {{- include "shepherd.podSecurity" . | nindent 8 }}
      initContainers:
        # Make the two directories on a new volume. fsGroup makes the volume writable by
        # the daemon's group, so nothing here runs as root and the pod meets the
        # restricted Pod Security level.
        - name: make-directories
          image: {{ include "shepherd.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - mkdir -p /data/home /data/workspace && chmod 0700 /data/home
          securityContext: {{- include "shepherd.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /data}
        # Copy each credential to a private in-memory volume at mode 0600, owned by the
        # daemon's user. The Secret mount itself is not given to the daemon. The agent and
        # forge CLIs' directories (glab, gh, claude) are only seeds: the entrypoint copies
        # them once into the home, where the tools can write.
        - name: place-credentials
          image: {{ include "shepherd.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              s=/secret-source; d=/run/secrets/shepherd
              umask 077
              mkdir -p $d/ssh $d/glab $d/gh $d/claude
              put() { [ -f "$s/$1" ] && install -m 0600 "$s/$1" "$d/$2"; return 0; }
              put totp-key totp-key
              put ssh-id ssh/id
              put ssh-known-hosts ssh/known_hosts
              put glab-config glab/config.yml
              put gh-hosts gh/hosts.yml
              put claude-credentials claude/.credentials.json
              [ -f $d/totp-key ] || { echo "no totp-key in the {{ .Values.credentials.secretName }} Secret" >&2; exit 1; }
          securityContext: {{- include "shepherd.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - {name: credentials-source, mountPath: /secret-source, readOnly: true}
            - {name: credentials, mountPath: /run/secrets/shepherd}
      containers:
        - name: shepherd
          image: {{ include "shepherd.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            # Read only when the home is empty, to seed config.yaml. Not credentials.
            - {name: SHEPHERD_PUBLIC_URL, value: {{ $url | quote }}}
            - {name: SHEPHERD_TRUSTED_PROXIES, value: {{ $proxies | quote }}}
          ports:
            - {name: https, containerPort: 8443}
          # Readiness hits the unauthenticated GET /v1/health on the public listener,
          # over plain HTTP: TLS ends at the Ingress, and the daemon only takes proxied
          # plain HTTP (trusted_proxies) there. The public listener opens only once an
          # owner account exists, so liveness and startup stay `shepherd status`, which
          # asks over loopback with the operator token and answers from the first boot.
          # Readiness failing before then keeps the pod out of endpoints until there is a
          # login to serve.
          startupProbe:
            exec: {command: ["shepherd", "status"]}
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            exec: {command: ["shepherd", "status"]}
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /v1/health, port: 8443, scheme: HTTP}
            periodSeconds: 15
            timeoutSeconds: 10
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data/home, subPath: home}
            - {name: data, mountPath: /data/workspace, subPath: workspace}
            - {name: credentials, mountPath: /run/secrets/shepherd, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: credentials-source
          secret:
            secretName: {{ .Values.credentials.secretName }}
            defaultMode: 0400   # with fsGroup, files read as 0440 for the group
        - name: credentials
          emptyDir: {medium: Memory}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests: {storage: {{ .Values.persistence.size }}}
