# One replica: the home lock refuses a second daemon, and the volume is ReadWriteOnce.
# Replace the image tag with the release you installed.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: shepherd
  namespace: shepherd
spec:
  serviceName: shepherd
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels: {app.kubernetes.io/name: shepherd}
  template:
    metadata:
      labels: {app.kubernetes.io/name: shepherd}
    spec:
      # The daemon ends its agents and records their runs on SIGTERM (about 20 seconds);
      # this is well past that, so a restart is never a SIGKILL of work in progress.
      terminationGracePeriodSeconds: 120
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        # fsGroup makes the volume writable by the daemon and the Secret's files readable by
        # its group (mode 0440). That would trip the daemon's refusal of a group-readable
        # TOTP key, so the daemon never sees the Secret mount: the place-credentials step
        # below copies each file to a private volume at 0600.
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        # Make the two directories on a new volume. fsGroup (above) makes the volume
        # writable by the daemon's group, so nothing here runs as root and the pod meets
        # the namespace's restricted Pod Security level.
        - name: make-directories
          image: ghcr.io/ubixsys/ubixshepherd:v0.1.0
          command: ["/bin/sh", "-c"]
          args:
            - mkdir -p /data/home /data/workspace && chmod 0700 /data/home
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
        # Copy each credential to a private in-memory volume at mode 0600, owned by the
        # daemon's user. The Secret mount itself is not given to the daemon. The agent and
        # forge CLIs' directories (glab, gh, claude) are only seeds: the entrypoint copies
        # them once into the home, where the tools can write.
        - name: place-credentials
          image: ghcr.io/ubixsys/ubixshepherd:v0.1.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              s=/secret-source; d=/run/secrets/shepherd
              umask 077
              mkdir -p $d/ssh $d/glab $d/gh $d/claude
              put() { [ -f "$s/$1" ] && install -m 0600 "$s/$1" "$d/$2"; return 0; }
              put totp-key totp-key
              put ssh-id ssh/id
              put ssh-known-hosts ssh/known_hosts
              put glab-config glab/config.yml
              put gh-hosts gh/hosts.yml
              put claude-credentials claude/.credentials.json
              [ -f $d/totp-key ] || { echo "no totp-key in the shepherd-credentials Secret" >&2; exit 1; }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: credentials-source, mountPath: /secret-source, readOnly: true}
            - {name: credentials, mountPath: /run/secrets/shepherd}
      containers:
        - name: shepherd
          image: ghcr.io/ubixsys/ubixshepherd:v0.1.0
          env:
            # Read only when the home is empty, to seed config.yaml. Not credentials.
            - {name: SHEPHERD_PUBLIC_URL, value: "https://shepherd.example.com"}
            # REQUIRED EDIT: the ingress controller's pod addresses (a CIDR or list). Every
            # address here may claim a request came over TLS and name its client, so use
            # the controller's own range, never the whole pod network. The placeholder is
            # refused by the image's entrypoint, so the pod does not start unedited.
            - {name: SHEPHERD_TRUSTED_PROXIES, value: "REPLACE-WITH-INGRESS-CONTROLLER-POD-CIDR"}
          ports:
            - {name: https, containerPort: 8443}
          # Probes hit the unauthenticated GET /v1/health on the public listener, over
          # plain HTTP: TLS ends at the Ingress, and the daemon only takes proxied
          # plain HTTP (trusted_proxies) there. The Host is the pod's IP, which the
          # health path answers; every other route still needs the public host and a
          # login. `shepherd status` stays the startup probe and the image's
          # health check: it asks over loopback with the operator token.
          startupProbe:
            exec: {command: ["shepherd", "status"]}
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet: {path: /v1/health, port: 8443, scheme: HTTP}
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /v1/health, port: 8443, scheme: HTTP}
            periodSeconds: 15
            timeoutSeconds: 10
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 4Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data/home, subPath: home}
            - {name: data, mountPath: /data/workspace, subPath: workspace}
            - {name: credentials, mountPath: /run/secrets/shepherd, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: credentials-source
          secret:
            secretName: shepherd-credentials
            defaultMode: 0400   # with fsGroup, files read as 0440 for the group
        - name: credentials
          emptyDir: {medium: Memory}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        # storageClassName: your CSI class, one that supports VolumeSnapshots
        resources:
          requests: {storage: 50Gi}
