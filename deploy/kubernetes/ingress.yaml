# TLS ends here. The daemon only takes plain HTTP from the proxy addresses in
# daemon.public.trusted_proxies, and only with X-Forwarded-Proto: https, which ingress-nginx
# sets. cert-manager issues the certificate; use your own issuer or a pre-made Secret.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shepherd
  namespace: shepherd
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt   # your issuer
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"   # the feed and desk stream
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [shepherd.example.com]
      secretName: shepherd-tls
  rules:
    - host: shepherd.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: shepherd, port: {name: https}}
