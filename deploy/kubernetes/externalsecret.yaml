# Secret templates with no values. These ExternalSecrets (external-secrets.io) make the
# Secret `shepherd-credentials` from a store you already run, such as Vault. Nothing here
# holds a credential, and none is applied from this repo. Set the store name and the
# remote paths, or replace this file with a Vault Agent or CSI provider that writes the
# same keys. Each key becomes one file under /run/secrets/shepherd in the pod.
#
# Keys (the pod's init step puts each at mode 0600, owned by the daemon's user):
#   totp-key          at least 16 random bytes; encrypts the TOTP secret at rest
#   ssh-id            the git push key (private half)
#   ssh-known-hosts   the forges' host keys
#   glab-config       glab's config.yml (holds the GitLab token)
#   gh-hosts          gh's hosts.yml
#   claude-credentials  the agent CLI's login state (.credentials.json)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shepherd-credentials
  namespace: shepherd
spec:
  # The Secret refreshes hourly, but the glab, gh and claude entries are only seeds: the
  # pod copies each into the home once and never replaces it, so a rotated token there has
  # no effect until its file under /data/home/cli is deleted and the pod restarted.
  # totp-key and the ssh files are read from the Secret on every start.
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault            # your store
  target:
    name: shepherd-credentials
    creationPolicy: Owner
  data:
    - secretKey: totp-key
      remoteRef: {key: shepherd/totp-key}
    - secretKey: ssh-id
      remoteRef: {key: shepherd/ssh-id}
    - secretKey: ssh-known-hosts
      remoteRef: {key: shepherd/ssh-known-hosts}
    - secretKey: glab-config
      remoteRef: {key: shepherd/glab-config}
    - secretKey: gh-hosts
      remoteRef: {key: shepherd/gh-hosts}
    - secretKey: claude-credentials
      remoteRef: {key: shepherd/claude-credentials}
---
# The shape of the Secret it produces, for a cluster with no operator: create it with
# `kubectl create secret generic shepherd-credentials --from-file=...` from files that
# never touch this repo. Left here as a comment on purpose.
#
# apiVersion: v1
# kind: Secret
# metadata: {name: shepherd-credentials, namespace: shepherd}
# type: Opaque
# data: {}    # no values
