<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <title>uBixShepherd: One voice to direct a whole swarm of AI agents.</title>
  <rect width="1280" height="640" fill="#151b21"/>
  <rect x="0" y="0" width="1280" height="8" fill="#0f62fe"/>
  <!-- mark: the logo's crook and four-square grid, scaled up -->
  <g transform="translate(80 80) scale(3.75)">
    <rect width="32" height="32" fill="#0f62fe"/>
    <path d="M10.5 27V11.5a5 5 0 0 1 10 0v3.5" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="square"/>
    <rect x="17" y="18" width="4" height="4" fill="#ffffff"/>
    <rect x="22.5" y="18" width="4" height="4" fill="#ffffff" opacity="0.55"/>
    <rect x="17" y="23" width="4" height="4" fill="#ffffff" opacity="0.55"/>
    <rect x="22.5" y="23" width="4" height="4" fill="#ffffff"/>
  </g>
  <g font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" fill="#e3e8ec">
    <text x="80" y="300" font-size="112"><tspan font-weight="300">uBix</tspan><tspan font-weight="600">Shepherd</tspan></text>
    <text x="84" y="372" font-size="40" fill="#b3bec7">One voice to direct a whole swarm of AI agents.</text>
  </g>
  <!-- lanes: four agent lanes converging on one point, the person's single thread -->
  <g transform="translate(0 -14)" fill="none" stroke-width="10" stroke-linecap="butt" stroke-linejoin="round">
    <path d="M80 440H600C700 440 740 520 840 520" stroke="#2f7fb0"/>
    <path d="M80 490H620C720 490 750 520 840 520" stroke="#8a4fc0"/>
    <path d="M80 550H620C720 550 750 520 840 520" stroke="#b8406f"/>
    <path d="M80 600H600C700 600 740 520 840 520" stroke="#4a6ee8"/>
    <path d="M840 520H1200" stroke="#7fbfa4"/>
  </g>
  <rect transform="translate(0 -14)" x="820" y="500" width="40" height="40" fill="#e0a43a"/>
</svg>
